[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gridfm-trustlayer"
dynamic = ["version"]
description = "Conformal trustworthiness layer for GridFM foundation models"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Antonio Alcántara", email = "antonio.alcantara@cunef.edu" }]
keywords = ["conformal prediction", "uncertainty quantification", "foundation models", "power systems", "contingency screening"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=2.2",
  "pandas>=2.3",
  "pyarrow>=15",
  "scipy>=1.13",
  "pyyaml>=6",
]

[project.urls]
Repository = "https://github.com/gridfm/gridfm-trustlayer"
Issues = "https://github.com/gridfm/gridfm-trustlayer/issues"
Changelog = "https://github.com/gridfm/gridfm-trustlayer/blob/main/CHANGELOG.md"
Paper = "https://arxiv.org/abs/2602.07995"

[project.optional-dependencies]
# gridfm-datakit imports `run_julia` from juliapkg, which juliapkg 0.1.26
# removed. Cap it until datakit adopts the replacement API.
graphkit = ["gridfm-graphkit>=0.0.6", "gridfm-datakit>=1.0.2", "juliapkg<0.1.26"]
# Jupyter form that builds a config file: gridfm_trustlayer.interactive.config_builder()
interactive = ["ipywidgets>=8"]
dev = ["ruff", "mypy", "pre-commit", "build", "mkdocs", "mkdocs-material"]
test = ["pytest", "pytest-cov", "gridfm-datakit>=1.0.2", "juliapkg<0.1.26", "ipywidgets>=8"]

[project.scripts]
gridfm_trustlayer = "gridfm_trustlayer.cli:main"

[tool.setuptools.dynamic]
# Single source of truth for the version: gridfm_trustlayer/_version.py
version = { attr = "gridfm_trustlayer._version.__version__" }

[tool.setuptools.packages.find]
include = ["gridfm_trustlayer*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
ignore = [
  # TRY004 assumes an isinstance check guards against a caller bug, so it wants
  # TypeError. Every occurrence here validates the shape of untrusted file
  # content (a YAML config, a JSON artifact) and reports it to the user, where
  # ValueError is the correct semantics and the documented behaviour.
  "TRY004",
]

[tool.mypy]
# numpy's stubs use PEP 695 `type` statements, which mypy refuses to parse when
# targeting < 3.12 -- it aborts on the stub before checking any project code.
# Type-check against 3.12; the >=3.10 floor stays enforced by ruff's
# target-version and by the Python 3.10 test job in CI.
python_version = "3.12"
files = ["gridfm_trustlayer", "tests"]
warn_unused_configs = true
