name: Release

# Publishing a GitHub release builds the sdist and wheel from the tagged commit,
# checks them, attaches them to the release and publishes them to PyPI. Run it
# by hand (Actions > Release > Run workflow) to build and check without
# publishing anything.
#
# PyPI publishing uses trusted publishing: no token is stored here. On pypi.org,
# the project (or, before the first upload, a "pending publisher") must trust
# this repository, the workflow file `release.yml` and the environment `pypi`.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check the distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('gridfm_trustlayer/_version.py').read()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the package version $version." >&2
            exit 1
          fi

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Install the wheel in a clean environment and run it
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/python -m pip install dist/*.whl
          /tmp/wheel-check/bin/gridfm_trustlayer --version
          /tmp/wheel-check/bin/python -c "import gridfm_trustlayer"

      - name: Keep the distributions for the next jobs
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  attach:
    name: Attach the distributions to the release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/gridfm-trustlayer/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
