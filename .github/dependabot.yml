# Keeps the GitHub Actions used by the workflows up to date. Python
# dependencies are declared as lower bounds in pyproject.toml and need no pins;
# .github/minimum-versions.txt pins those bounds on purpose, for the CI job
# that tests them, and must not be updated.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
