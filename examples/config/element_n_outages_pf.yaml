# Element CP stratified by contingency severity
#
# The canonical N-k screening setup: separate residual quantiles per number of
# simultaneous outages, so bounds widen with severity instead of averaging over it.
# `n_outages` counts both out-of-service branches and out-of-service generators.
#
# Run:
#   gridfm_trustlayer compute   --config examples/config/element_n_outages_pf.yaml
#   gridfm_trustlayer calibrate --config examples/config/element_n_outages_pf.yaml
#   gridfm_trustlayer screen    --config examples/config/element_n_outages_pf.yaml
#   gridfm_trustlayer apply     --config examples/config/element_n_outages_pf.yaml   # new scenarios
#
# Replace every `path/to/...` with your own artifacts before running.

version: 1

task_name: PowerFlow
cp_type: element
strat: n_outages
# Buses or lines with too few calibration samples in a stratum use their quantile
# over all strata there (no guarantee within the stratum); `infinite` keeps it.
# sparse_strata: infinite
alpha: 0.1

variables:
  - Vm
  - Va
  - line_loading

screen_bounds:
  Vm:
    lower: 0.95
    upper: 1.05
  line_loading:
    upper: 1.0

# Two separately generated datasets: `compute` fits the layer on the
# calibration set, `calibrate` and `screen` apply and evaluate it on the test set.
# They must be different data (e.g. datakit runs with different seeds).
inputs:
  calibration:  # read by `compute`
    predictions: path/to/calibration/predictions.parquet
    pf_node: path/to/calibration/raw/bus_data.parquet
    pf_edge: path/to/calibration/raw/branch_data.parquet
  test:  # read by `calibrate` and `screen`
    predictions: path/to/test/predictions.parquet
    pf_node: path/to/test/raw/bus_data.parquet
    pf_edge: path/to/test/raw/branch_data.parquet
  # Optional: new scenarios without a known AC solution, for `apply`. The bus and
  # branch files give their outages (for strat: n_outages) and branch parameters
  # (for line_loading); no solved values are read. Power-flow predictions must
  # carry the set-points (Vm_target at PV buses, Va_target at the reference bus).
  # With screen_bounds, `apply` also gives every new scenario its status
  # (secure, uncertain, insecure), by the same rule as `screen`.
  # apply:
  #   predictions: path/to/new/predictions.parquet
  #   pf_node: path/to/new/raw/bus_data.parquet
  #   pf_edge: path/to/new/raw/branch_data.parquet

outputs:
  artifact: trustlayer_outputs/element/n_outages_pf.trustlayer
  calibrated_predictions_volt: trustlayer_outputs/element/n_outages_pf_vm_va_with_intervals.parquet
  calibrated_predictions_line: trustlayer_outputs/element/n_outages_pf_line_loading_with_intervals.parquet
  screen_dir: trustlayer_outputs/element/n_outages_pf_screen
  # For `apply`: the bounds of the new scenarios, and their status report.
  # applied_predictions: trustlayer_outputs/element/n_outages_pf_applied
  # status_dir: trustlayer_outputs/element/n_outages_pf_applied/status

# `screen` defaults to the shared `variables` list, but Va has no natural
# operating bound. Restrict screening to the variables that do.
commands:
  screen:
    variables:
      - Vm
      - line_loading
