# Element CP stratified by system load level
#
# Groups scenarios into percentile bins of total active demand, learned from the
# calibration split and stored in the artifact. Use this when model error tracks
# loading level more than it tracks topology.
#
# Run:
#   gridfm_trustlayer compute   --config examples/config/element_system_load_bin_pf.yaml
#   gridfm_trustlayer calibrate --config examples/config/element_system_load_bin_pf.yaml
#   gridfm_trustlayer screen    --config examples/config/element_system_load_bin_pf.yaml
#
# Replace every `path/to/...` with your own artifacts before running.

version: 1

task_name: PowerFlow
cp_type: element
strat: system_load_bin
# Required whenever strat is system_load_bin.
system_load_n_bins: 5
alpha: 0.1

variables:
  - Vm
  - Va
  - line_loading

screen_bounds:
  Vm:
    lower: 0.95
    upper: 1.05
  line_loading:
    upper: 1.0

# Two separately generated datasets: `compute` fits the layer on the
# calibration set, `calibrate` and `screen` apply and evaluate it on the test set.
# They must be different data (e.g. datakit runs with different seeds).
inputs:
  calibration:  # read by `compute`
    predictions: path/to/calibration/predictions.parquet
    pf_node: path/to/calibration/raw/bus_data.parquet
    pf_edge: path/to/calibration/raw/branch_data.parquet
  test:  # read by `calibrate` and `screen`
    predictions: path/to/test/predictions.parquet
    pf_node: path/to/test/raw/bus_data.parquet
    pf_edge: path/to/test/raw/branch_data.parquet

outputs:
  artifact: trustlayer_outputs/element/system_load_bin_pf.trustlayer
  calibrated_predictions_volt: trustlayer_outputs/element/system_load_bin_pf_vm_va_with_intervals.parquet
  calibrated_predictions_line: trustlayer_outputs/element/system_load_bin_pf_line_loading_with_intervals.parquet
  screen_dir: trustlayer_outputs/element/system_load_bin_pf_screen

# `screen` defaults to the shared `variables` list, but Va has no natural
# operating bound. Restrict screening to the variables that do.
commands:
  screen:
    variables:
      - Vm
      - line_loading
