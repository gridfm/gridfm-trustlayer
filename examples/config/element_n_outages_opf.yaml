# Element CP on OPF artifacts
#
# OPF solutions are usually feasible by construction, so screening against the solver's
# own limits finds few true violations. Tighter operational margins turn the screen
# into a near-limit risk alarm, which is the informative reading for OPF.
#
# Run:
#   gridfm_trustlayer compute   --config examples/config/element_n_outages_opf.yaml
#   gridfm_trustlayer calibrate --config examples/config/element_n_outages_opf.yaml
#   gridfm_trustlayer screen    --config examples/config/element_n_outages_opf.yaml
#
# Replace every `path/to/...` with your own artifacts before running.

version: 1

task_name: OptimalPowerFlow
cp_type: element
strat: n_outages
alpha: 0.1

variables:
  - Vm
  - Va
  - line_loading

# Deliberately tighter than the physical limits; see docs/user-guide/data.md.
screen_bounds:
  Vm:
    lower: 0.97
    upper: 1.03
  line_loading:
    upper: 0.95

# Two separately generated datasets: `compute` fits the layer on the
# calibration set, `calibrate` and `screen` apply and evaluate it on the test set.
# They must be different data (e.g. datakit runs with different seeds).
inputs:
  calibration:  # read by `compute`
    predictions: path/to/calibration/predictions.parquet
    generator_predictions: path/to/calibration/predictions_gen.parquet
    pf_node: path/to/calibration/raw/bus_data.parquet
    pf_edge: path/to/calibration/raw/branch_data.parquet
  test:  # read by `calibrate` and `screen`
    predictions: path/to/test/predictions.parquet
    generator_predictions: path/to/test/predictions_gen.parquet
    pf_node: path/to/test/raw/bus_data.parquet
    pf_edge: path/to/test/raw/branch_data.parquet

outputs:
  artifact: trustlayer_outputs/optimalpowerflow/n_outages_opf.trustlayer
  calibrated_predictions_volt: trustlayer_outputs/optimalpowerflow/n_outages_opf_vm_va_with_intervals.parquet
  calibrated_predictions_line: trustlayer_outputs/optimalpowerflow/n_outages_opf_line_loading_with_intervals.parquet
  screen_dir: trustlayer_outputs/optimalpowerflow/n_outages_opf_screen

# `screen` defaults to the shared `variables` list, but Va has no natural
# operating bound. Restrict screening to the variables that do.
commands:
  screen:
    variables:
      - Vm
      - line_loading
