# Kernel-weighted CP with the k-nearest-neighbour bandwidth
#
# KCP localizes the quantile to each test scenario using a scenario embedding, so
# bounds adapt per scenario rather than per stratum. Here the bandwidth is the
# distance to the k_nn-th nearest neighbour, instead of the default n_eff target.
#
# Run:
#   gridfm_trustlayer compute   --config examples/config/kernel_knn_pf.yaml
#   gridfm_trustlayer calibrate --config examples/config/kernel_knn_pf.yaml
#   gridfm_trustlayer screen    --config examples/config/kernel_knn_pf.yaml
#
# Replace every `path/to/...` with your own artifacts before running.

version: 1

task_name: PowerFlow
cp_type: kernel
# Kernel weighting nests INSIDE stratification: a 2-outage test scenario draws
# its neighbours only from 2-outage calibration scenarios.
strat: n_outages
alpha: 0.1

embedding_pooling: mean
distance: euclidean
bandwidth: knn
k_nn: 20
n_eff_min: 5

variables:
  - Vm
  - Va
  - line_loading

screen_bounds:
  Vm:
    lower: 0.95
    upper: 1.05
  line_loading:
    upper: 1.0

# Two separately generated datasets: `compute` fits the layer on the
# calibration set, `calibrate` and `screen` apply and evaluate it on the test set.
# They must be different data (e.g. datakit runs with different seeds).
# Embeddings are required for cp_type: kernel; produce them with
#   gridfm_graphkit predict --get_embeddings
inputs:
  calibration:  # read by `compute`
    predictions: path/to/calibration/predictions.parquet
    embeddings: path/to/calibration/bus_embeddings.parquet
    pf_node: path/to/calibration/raw/bus_data.parquet
    pf_edge: path/to/calibration/raw/branch_data.parquet
  test:  # read by `calibrate` and `screen`
    predictions: path/to/test/predictions.parquet
    embeddings: path/to/test/bus_embeddings.parquet
    pf_node: path/to/test/raw/bus_data.parquet
    pf_edge: path/to/test/raw/branch_data.parquet

outputs:
  artifact: trustlayer_outputs/kernel/knn_pf.trustlayer
  # Each example has its own report folder, so that runs do not mix their reports.
  coverage_dir: trustlayer_outputs/kernel/knn_pf_coverage
  calibrated_predictions_volt: trustlayer_outputs/kernel/knn_pf_vm_va_with_intervals.parquet
  calibrated_predictions_line: trustlayer_outputs/kernel/knn_pf_line_loading_with_intervals.parquet
  screen_dir: trustlayer_outputs/kernel/knn_pf_screen

# `screen` defaults to the shared `variables` list, but Va has no natural
# operating bound. Restrict screening to the variables that do.
commands:
  screen:
    variables:
      - Vm
      - line_loading
