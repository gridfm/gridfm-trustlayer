# Element CP stratified by predicted value
#
# Groups individual predictions -- not whole scenarios -- into percentile bins of the
# model's own output, with one edge set learned per variable. Use this when error
# scales with the magnitude being predicted, e.g. heavily loaded lines.
#
# Run:
#   gridfm_trustlayer compute   --config examples/config/element_pred_bins_pf.yaml
#   gridfm_trustlayer calibrate --config examples/config/element_pred_bins_pf.yaml
#   gridfm_trustlayer screen    --config examples/config/element_pred_bins_pf.yaml
#
# Replace every `path/to/...` with your own artifacts before running.

version: 1

task_name: PowerFlow
cp_type: element
strat: pred_bins
# Required whenever strat is pred_bins.
pred_n_bins: 5
alpha: 0.1

calibration_fraction: 0.3
random_seed: 7

variables:
  - Vm
  - Va
  - line_loading

screen_bounds:
  Vm:
    lower: 0.95
    upper: 1.05
  line_loading:
    upper: 1.0

inputs:
  predictions: path/to/predictions.parquet
  pf_node: path/to/raw/bus_data.parquet
  pf_edge: path/to/raw/branch_data.parquet

outputs:
  artifact: trustlayer_outputs/element/pred_bins_pf.trustlayer
  calibrated_predictions_volt: trustlayer_outputs/element/pred_bins_pf_vm_va_with_intervals.parquet
  calibrated_predictions_line: trustlayer_outputs/element/pred_bins_pf_line_loading_with_intervals.parquet
  screen_dir: trustlayer_outputs/element/pred_bins_pf_screen

# `screen` defaults to the shared `variables` list, but Va has no natural
# operating bound. Restrict screening to the variables that do.
commands:
  screen:
    variables:
      - Vm
      - line_loading
