# Kernel-weighted CP with cosine distance
#
# Compares scenarios by the DIRECTION in which they deviate from the mean scenario,
# discarding the magnitude of that deviation. Costs nothing to try, but on IEEE-24
# line loading it produced wider intervals than Euclidean and than plain SCP, so
# treat it as an experiment rather than a default.
#
# Run:
#   gridfm_trustlayer compute   --config examples/config/kernel_cosine_pf.yaml
#   gridfm_trustlayer calibrate --config examples/config/kernel_cosine_pf.yaml
#   gridfm_trustlayer screen    --config examples/config/kernel_cosine_pf.yaml
#
# Replace every `path/to/...` with your own artifacts before running.

version: 1

task_name: PowerFlow
cp_type: kernel
strat: n_outages
alpha: 0.1

calibration_fraction: 0.3
random_seed: 7

embedding_pooling: mean
# Squared Euclidean distance on unit-norm representations, i.e. 2 - 2*cos.
# Not a remedy for distance concentration -- angular distances concentrate too.
distance: cosine
bandwidth: knn
k_nn: 75
n_eff_min: 5

variables:
  - Vm
  - Va
  - line_loading

screen_bounds:
  Vm:
    lower: 0.95
    upper: 1.05
  line_loading:
    upper: 1.0

inputs:
  predictions: path/to/predictions.parquet
  # Required for cp_type: kernel. Produced by
  #   gridfm_graphkit predict --get_embeddings
  embeddings: path/to/predictions/bus_embeddings.parquet
  pf_node: path/to/raw/bus_data.parquet
  pf_edge: path/to/raw/branch_data.parquet

outputs:
  artifact: trustlayer_outputs/kernel/cosine_pf.trustlayer
  calibrated_predictions_volt: trustlayer_outputs/kernel/cosine_pf_vm_va_with_intervals.parquet
  calibrated_predictions_line: trustlayer_outputs/kernel/cosine_pf_line_loading_with_intervals.parquet
  screen_dir: trustlayer_outputs/kernel/cosine_pf_screen

# `screen` defaults to the shared `variables` list, but Va has no natural
# operating bound. Restrict screening to the variables that do.
commands:
  screen:
    variables:
      - Vm
      - line_loading
