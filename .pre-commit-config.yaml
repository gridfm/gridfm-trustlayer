repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Syntax check only: mkdocs.yml uses a !!python/name tag (mermaid fences).
        args: [--unsafe]
      - id: debug-statements
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: >-
          bash -lc '
          if [ -x /opt/miniconda3/bin/conda ] && /opt/miniconda3/bin/conda env list | grep -qE "^[[:space:]]*trustlayer[[:space:]]"; then
            /opt/miniconda3/bin/conda run --no-capture-output -n trustlayer python -m mypy gridfm_trustlayer tests;
          else
            python -m mypy gridfm_trustlayer tests;
          fi'
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: >-
          bash -lc '
          if [ -x /opt/miniconda3/bin/conda ] && /opt/miniconda3/bin/conda env list | grep -qE "^[[:space:]]*trustlayer[[:space:]]"; then
            /opt/miniconda3/bin/conda run --no-capture-output -n trustlayer python -m pytest -q;
          else
            python -m pytest -q;
          fi'
        language: system
        pass_filenames: false
